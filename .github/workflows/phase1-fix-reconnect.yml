name: Phase 1 fix reconnect ordering
on:
  push:
    branches: [chatgpt/faza1-cloud-sync]
    paths: [.github/workflows/phase1-fix-reconnect.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
      - name: Patch reconnect ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""        if(await healthCheck()){
          let r={ok:false,offline:true};
          try{r=await nativePullState()}catch(e){}
          if((r&&r.ok)||serverOnline){
            wakeCooldownUntil=0;
            try{nativeUpdateSyncUI()}catch(e){}
            try{toast('Lidhja me serverin u rikthye')}catch(e){}
            return true;
          }
        }
"""
          new="""        if(await healthCheck()){
          let r={ok:false,offline:true};
          try{
            if(syncIsDirty())r=await nativePushState();
            else r=await nativePullState();
          }catch(e){}
          if(r&&r.conflict){
            serverOnline=true;
            try{nativeUpdateSyncUI()}catch(e){}
            return false;
          }
          if(r&&r.ok&&!r.offline){
            wakeCooldownUntil=0;
            try{nativeUpdateSyncUI()}catch(e){}
            try{toast('Lidhja me serverin u rikthye')}catch(e){}
            return true;
          }
        }
"""
          if old not in s: raise SystemExit('target block not found; refusing unsafe patch')
          s=s.replace(old,new,1)
          if s.count('if(syncIsDirty())r=await nativePushState();')!=1: raise SystemExit('patch invariant failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/scripts').mkdir(exist_ok=True)
          for i,x in enumerate(scripts):
            if x.strip(): Path(f'/tmp/scripts/{i}.js').write_text(x,encoding='utf-8')
          PY
          for f in /tmp/scripts/*.js; do node --check "$f"; done
      - name: Commit patch
        run: |
          git config user.name 'ChatGPT Phase 1'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(cloud): push dirty offline state before reconnect pull'
          git push origin HEAD:chatgpt/faza1-cloud-sync
