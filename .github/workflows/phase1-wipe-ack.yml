name: Phase 1 persistent wipe acknowledgement
on:
  push:
    branches: [chatgpt/faza1-cloud-sync]
    paths:
      - .github/workflows/phase1-wipe-ack.yml
      - .github/phase1-wipe-ack.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
      - name: Apply wipe acknowledgement patch
        run: python3 .github/phase1-wipe-ack.py
      - name: Check inline JavaScript syntax
        run: node tests/check-syntax.cjs
      - name: Verify wipe acknowledgement invariants
        run: |
          grep -F "wipeAckGet()===wipedAt" index.html
          if grep -F "syncConflictLocal=null;wipeAckSet(null);serverOnline=true" index.html; then exit 1; fi
      - name: Commit frontend fix
        run: |
          git config user.name 'ChatGPT Phase 1'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(cloud): retain wipe acknowledgement for persistent epoch'
          git push origin HEAD:chatgpt/faza1-cloud-sync
