name: Phase 1 cloud two-device E2E

on:
  push:
    branches:
      - chatgpt/faza1-cloud-sync
    paths:
      - index.html
      - tests/phase1-cloud-two-device.cjs
      - .github/workflows/phase1-cloud-e2e.yml
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
      - uses: actions/checkout@v4
        with:
          repository: genilufra-droid/biobes-api
          ref: chatgpt/faza1-cloud-sync
          path: api
      - name: Install frontend test dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: api/backend
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run two-device cloud test
        run: node tests/phase1-cloud-two-device.cjs
