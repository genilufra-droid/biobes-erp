name: Inspect packaging validation
on:
  push:
    branches: [chatgpt/fix-paketim-kg]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract validation context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.find('// Update KPI logic', s.find('biobes-paketim-v4'))
          end=s.find('</script>', start)
          Path('PACKAGING-VALIDATION.txt').write_text(s[start:end], encoding='utf-8')
          PY
      - name: Commit snippet
        run: |
          git config user.name "chatgpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add PACKAGING-VALIDATION.txt
          git commit -m "chore: inspect packaging validation" || exit 0
          git push
