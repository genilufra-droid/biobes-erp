name: Apply BioBes packaging KG fix
on:
  push:
    branches:
      - chatgpt/fix-paketim-kg
    paths:
      - '.github/PACKAGING-RUN.txt'
      - '.github/patch_packaging_kg.py'
      - '.github/workflows/assemble-exact.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply packaging patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patch_packaging_kg.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already patched'
            exit 0
          fi
          git commit -m 'fix: packaging KG autofill and admin stock override'
          git push
