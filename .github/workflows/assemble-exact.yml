name: Assemble exact delivered build
on:
  push:
    branches: [chatgpt/package-lot-picker]
    paths:
      - '.github/insert-fragment.html'
      - '.github/workflows/assemble-exact.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert exact fragment and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          frag=Path('.github/insert-fragment.html').read_text(encoding='utf-8').strip()
          marker='<script id="biobes-paketim-v4">'
          if marker in s:
            print('already assembled')
            raise SystemExit(0)
          idx=s.find('</body>')
          if idx<0:
            raise SystemExit('missing </body>')
          s=s[:idx]+frag+'\n'+s[idx:]
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Assemble exact delivered package lot picker build'
          git push
