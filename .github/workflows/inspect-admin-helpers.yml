name: Inspect core package guard
on:
  push:
    branches: [chatgpt/fix-paketim-kg]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract core package context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['function corePackage','corePackage =','corePackage(data)','lotUnpacked(lot)']
          out=[]
          for t in terms:
              pos=0
              for _ in range(20):
                  i=s.find(t,pos)
                  if i<0: break
                  out.append('### '+t+' @ '+str(i)+'\n'+s[max(0,i-5000):min(len(s),i+12000)])
                  pos=i+len(t)
          Path('COREPACKAGE.txt').write_text('\n\n'.join(out),encoding='utf-8')
          PY
      - name: Commit snippet
        run: |
          git config user.name "chatgpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add COREPACKAGE.txt
          git commit -m "chore: inspect core package guard" || exit 0
          git push
