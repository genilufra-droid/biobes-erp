name: Phase 1 wake audit
on:
  push:
    branches: [chatgpt/faza1-cloud-sync]
    paths: [.github/workflows/phase1-wake-audit.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
      - name: Extract wake logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8',errors='replace')
          k='wakeServerAndSync'
          i=s.find(k)
          if i<0: raise SystemExit('wakeServerAndSync not found')
          Path('wake-audit.txt').write_text(s[max(0,i-3000):min(len(s),i+7000)],encoding='utf-8')
          print('found',i)
          PY
      - name: Commit snippet
        run: |
          git config user.name 'ChatGPT Phase 1'
          git config user.email 'actions@users.noreply.github.com'
          git add wake-audit.txt
          git commit -m 'chore(test): wake logic snippet'
          git push origin HEAD:chatgpt/faza1-cloud-sync
