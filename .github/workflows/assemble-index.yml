name: Assemble BioBes frontend
on:
  push:
    paths:
      - 'frontend.xz'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact index.html
        shell: bash
        run: |
          set -euo pipefail
          xz -dc frontend.xz > index.html
          test "$(wc -c < index.html)" = "1581751"
          test "$(sha256sum index.html | awk '{print $1}')" = "c10706a0c67dd1d0066f28116aad4e6c888eee5479cdb65cee5d7e2243834017"
          rm frontend.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html frontend.xz
          git commit -m "Deploy exact BioBes ERP frontend"
          git push
