name: Inspect packaging v2
on:
  push:
    branches: [chatgpt/fix-paketim-kg-v2]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract packaging source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['window.packSourceRowHtml','window.packSourceSum','window.savePackaging','function corePackage','PACK_OVER_STOCK','overStock']
          out=[]
          for term in terms:
              pos=0
              for _ in range(20):
                  i=s.find(term,pos)
                  if i<0: break
                  out.append('### '+term+' @ '+str(i)+'\n'+s[max(0,i-3500):min(len(s),i+9000)])
                  pos=i+len(term)
          Path('PACKAGING-V2.txt').write_text('\n\n'.join(out),encoding='utf-8')
          PY
      - name: Commit snippet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PACKAGING-V2.txt
          git commit -m 'chore: inspect current packaging source' || exit 0
          git push
