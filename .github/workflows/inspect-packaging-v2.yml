name: Apply packaging autofill v2
on:
  push:
    branches: [chatgpt/fix-paketim-kg-v2]
    paths:
      - '.github/patch_packaging_autofill.py'
      - '.github/workflows/inspect-packaging-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply autofill patch
        run: python3 .github/patch_packaging_autofill.py
      - name: Verify packaging invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'auto_min':'Math.min(freeForAuto, remaining>0?remaining:freeForAuto)',
            'editable':'oninput="packSourceSum(\'${prefix}\')"',
            'admin_verify':'verifyAdminPassword(pass)',
            'reason_required':'reason.length<5',
            'audit':'PACK_OVER_STOCK',
            'core_guard':'data.overStock&&data.overStock.authorizedBy&&data.overStock.reason'
          }
          missing=[k for k,v in checks.items() if v not in s]
          if missing: raise SystemExit('Missing invariants: '+','.join(missing))
          print('Packaging invariants PASS:', ', '.join(checks))
          PY
          git diff --check
      - name: Commit index only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: autofill packaging KG from available stock'
          git push
