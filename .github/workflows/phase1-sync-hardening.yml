name: Phase 1 sync hardening

on:
  push:
    branches:
      - chatgpt/faza1-cloud-sync
    paths:
      - .github/workflows/phase1-sync-hardening.yml
      - .github/phase1-sync-patch.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
          fetch-depth: 0

      - name: Apply sync patch
        run: python3 .github/phase1-sync-patch.py

      - name: Verify sync invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'no blind version': 'baseVersion:force?null:serverVersion' not in s,
            'CAS baseVersion': 'baseVersion:base' in s,
            'single push lock': 'syncPushInFlight' in s and 'syncPushQueued' in s,
            'dirty sequence': 'syncChangeSeq===sentSeq' in s,
            'offline retry': "if(syncIsDirty()){await pushState();return}" in s,
            'visible pending status': 'Offline • ndryshime në pritje' in s,
          }
          for name,ok in checks.items(): print(('PASS ' if ok else 'FAIL ')+name)
          if not all(checks.values()): raise SystemExit(1)
          PY

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          out=Path('/tmp/biobes-scripts');out.mkdir(exist_ok=True)
          for i,script in enumerate(scripts):(out/f'{i:04d}.js').write_text(script,encoding='utf-8')
          print('scripts',len(scripts))
          PY
          failed=0
          for f in /tmp/biobes-scripts/*.js; do
            node --check "$f" >/dev/null 2>&1 || { echo "Syntax error: $f"; failed=1; }
          done
          test "$failed" -eq 0
          git diff --check

      - name: Commit hardened sync
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sync already hardened; no change required'
            exit 0
          fi
          git config user.name 'ChatGPT Phase 1'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(cloud): serial sync queue, CAS version and reconnect retry'
          git push origin HEAD:chatgpt/faza1-cloud-sync
