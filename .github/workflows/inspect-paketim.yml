name: Inspect packaging core
on:
  push:
    branches: [chatgpt/fix-paketim-kg]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract corePackage context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['function corePackage','corePackage =','corePackage(data)','lotUnpacked(lot)']
          out=[]
          for t in terms:
              start=0
              while True:
                  i=s.find(t,start)
                  if i<0: break
                  out.append(f'### {t} @ {i}\n')
                  out.append(s[max(0,i-5000):min(len(s),i+12000)])
                  out.append('\n\n')
                  start=i+1
          Path('COREPACKAGE.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit snippet
        run: |
          git config user.name "chatgpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add COREPACKAGE.txt
          git commit -m "chore: inspect core packaging guard" || exit 0
          git push
