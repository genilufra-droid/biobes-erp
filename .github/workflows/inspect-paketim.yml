name: Inspect packaging block
on:
  push:
    branches: [chatgpt/fix-paketim-kg]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract packaging context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['KG të marra','Paketim i ri','Shpërnda njëlloj']
          out=[]
          for t in terms:
              i=s.find(t)
              out.append(f'### {t} @ {i}\n')
              if i>=0:
                  out.append(s[max(0,i-5000):min(len(s),i+8000)])
                  out.append('\n\n')
          Path('PACKAGING-SNIPPET.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit snippet
        run: |
          git config user.name "chatgpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add PACKAGING-SNIPPET.txt
          git commit -m "chore: inspect packaging block" || exit 0
          git push
