name: Phase 1 inspect online sync
on:
  push:
    branches: [chatgpt/faza1-cloud-sync]
    paths: [.github/workflows/phase1-inspect-online.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for pat in ["addEventListener('online'",'addEventListener("online"','window.ononline','async function pollServerVersion','function queuePush','syncConflictPending']:
            print('\n###',pat)
            start=0
            while True:
              i=s.find(pat,start)
              if i<0: break
              print('AT',i); print(s[max(0,i-1000):i+3500]); start=i+1
          PY
