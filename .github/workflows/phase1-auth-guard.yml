name: Phase 1 harden cloud authentication

on:
  push:
    branches:
      - chatgpt/faza1-cloud-sync
    paths:
      - .github/workflows/phase1-auth-guard.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
          fetch-depth: 0

      - name: Make server authentication authoritative when reachable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start = text.find('async function loginUser(){')
          end = text.find('\nfunction showLogin(){', start)
          if start < 0 or end < 0:
              raise SystemExit('loginUser/showLogin markers not found; refusing to modify')

          block = text[start:end]
          tail_marker = "let u=state.users.find(x=>x.username.toLowerCase()===name);"
          tail_pos = block.find(tail_marker)
          if tail_pos < 0:
              raise SystemExit('Local-login tail marker not found; refusing to modify')
          local_tail = block[tail_pos:]

          strict_prefix = """async function loginUser(){let name=$val('loginName').trim().toLowerCase(),pass=$val('loginPass');if(serverBaseUrl()){try{let __s={ok:false,offline:true};$css('loginError','color','#996400');try{__s=await serverLoginRetry(name,pass,()=>{try{$text('loginError','Po verifikohet…')}catch(e){}})}catch(e){}$css('loginError','color','');if(__s.offline)$text('loginError','');if(__s.ok){await afterServerLogin();return}if(!__s.offline){$text('loginError',__s.error||'Përdoruesi ose fjalëkalimi është i pasaktë');return}}catch(__e){}}"""

          new_block = strict_prefix + local_tail
          if block != new_block:
              text = text[:start] + new_block + text[end:]

          # Remove any emergency local-admin bypass UI/function if an old build still contains it.
          text = re.sub(r'<p style="text-align:center;margin-top:8px"><button class="btn small" onclick="phoneFixMariglen\(\)".*?</button></p>', '', text, flags=re.S)
          fstart = text.find('async function phoneFixMariglen(){')
          if fstart >= 0:
              fend = text.find('\nfunction revealInitialCredential(){', fstart)
              if fend < 0:
                  raise SystemExit('phoneFixMariglen found but end marker missing')
              text = text[:fstart] + text[fend+1:]

          # Security assertions: no known emergency-bypass markers may remain.
          forbidden = [
              'Serveri tha gabim — po provoj lokalisht…',
              'phoneFixMariglen',
              'biobesMariglenFix'
          ]
          leftovers = [x for x in forbidden if x in text]
          if leftovers:
              raise SystemExit('Unsafe auth markers remain: ' + ', '.join(leftovers))

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          out = Path('/tmp/biobes-scripts')
          out.mkdir(exist_ok=True)
          for i, s in enumerate(scripts):
              (out / f'{i:04d}.js').write_text(s, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline scripts')
          PY
          failed=0
          for f in /tmp/biobes-scripts/*.js; do
            node --check "$f" >/dev/null 2>&1 || { echo "Syntax error: $f"; failed=1; }
          done
          test "$failed" -eq 0

      - name: Commit hardened frontend
        run: |
          if git diff --quiet -- index.html; then
            echo 'Frontend auth was already hardened; no change required'
            exit 0
          fi
          git config user.name 'ChatGPT Phase 1'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(auth): remove server-login bypass and require cloud auth when reachable'
          git push origin HEAD:chatgpt/faza1-cloud-sync
