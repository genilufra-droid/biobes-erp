# BioBes ERP — Render Static Site (Blueprint)
# Deploy: push në main → Render ribën build automatikisht (static, pa server).
# Ndryshimet e fundit (2026-09-10 rev3): pagesa furnitorësh, kartela e klikueshme,
# mostra & porositë upgrade, cold-start v3 inline, backup ditor automatik (çdo 24h/05:00,
# POST /api/backup) + pastrim komplet ADMIN me wipeUsers:true — gati për prodhim.
# Redeploy trigger: 2026-09-11 rev5 — sync main për Render — PR #14 e bashkuar (main 8c0be4b) (arena/01a08fc6-biobes-erp).
services:
  - type: web
    name: biobes-erp
    runtime: static
    buildCommand: mkdir -p public public/snapshots && cp index.html public/index.html && cp index.known-good.html public/index.known-good.html && { cp snapshots/LATEST-KNOWN-GOOD.sha256 public/snapshots/ 2>/dev/null || true; } && { cp snapshots/index-*.html public/snapshots/ 2>/dev/null || true; }
    staticPublishPath: ./public
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
