# BioBes ERP — Render Static Site
# Uses the exact frontend version uploaded as index-1-2.html.
services:
  - type: web
    name: biobes-erp
    runtime: static
    buildCommand: cp index-1-2.html index.html
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
